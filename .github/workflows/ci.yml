name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch cancels the older run. The suite ends in a
# production build plus Playwright, so a queue of superseded runs is expensive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check:all
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Keyed on the lockfile: the browser only needs re-downloading when the
      # Playwright version moves. install --with-deps stays cheap on a hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # One required check rather than six. A single gate is harder to hollow
      # out than a list where any one entry can quietly be made non-blocking.
      - name: pnpm check:all
        run: pnpm check:all

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
